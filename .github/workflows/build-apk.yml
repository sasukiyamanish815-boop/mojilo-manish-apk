name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find project folder
        id: project
        run: |
          PROJECT_DIR=$(find . -type f -name "package.json" \
            -not -path "*/node_modules/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm install

      - name: Build web app
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Find Gradle project
        id: gradle
        run: |
          GRADLEW=$(find "${{ steps.project.outputs.project_dir }}" -type f -name "gradlew" \
            -not -path "*/node_modules/*" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find "${{ steps.project.outputs.project_dir }}" -maxdepth 5 -type f | head -300
            exit 1
          fi

          echo "GRADLEW=$GRADLEW"
          echo "gradle_dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.gradle_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
