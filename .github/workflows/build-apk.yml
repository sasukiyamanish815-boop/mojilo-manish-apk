name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" \
            ! -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Android project files:"
          find project -maxdepth 4 -type f | head -200

      - name: Check Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "project/settings.gradle" ] && \
             [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -d "project/app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          echo "Android project detected successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Fix fillMaxWidth import
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE=$(find . -type f -name "MainActivity.kt" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity found: $FILE"

          if grep -q \
            "import androidx.compose.foundation.layout.fillMaxWidth" \
            "$FILE"; then

            echo "fillMaxWidth import already exists."

          else

            echo "Adding fillMaxWidth import..."

            sed -i \
              '/^package /a import androidx.compose.foundation.layout.fillMaxWidth' \
              "$FILE"

          fi

          grep -n "fillMaxWidth" "$FILE" || true

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find project \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
